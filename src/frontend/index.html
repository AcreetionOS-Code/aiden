<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIDEN - AcreetionOS AI Assistant</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #12121a;
            --bg-tertiary: #1a1a25;
            --bg-hover: #22222f;
            --text-primary: #ffffff;
            --text-secondary: #a0a0b0;
            --text-muted: #606070;
            --accent: #6366f1;
            --accent-hover: #818cf8;
            --accent-muted: #4f46e5;
            --border: #2a2a3a;
            --success: #22c55e;
            --warning: #f59e0b;
            --error: #ef4444;
            --code-bg: #16161f;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            padding: 1rem 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .logo {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, var(--accent) 0%, var(--accent-muted) 100%);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 1.2rem;
        }

        .header-title {
            font-weight: 600;
            font-size: 1.25rem;
        }

        .header-subtitle {
            font-size: 0.75rem;
            color: var(--text-secondary);
        }

        .header-right {
            display: flex;
            gap: 0.5rem;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 1rem;
            background: var(--bg-tertiary);
            border-radius: 8px;
            font-size: 0.875rem;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--success);
        }

        .status-dot.warning {
            background: var(--warning);
        }

        .status-dot.error {
            background: var(--error);
        }

        .btn {
            padding: 0.5rem 1rem;
            border: none;
            border-radius: 8px;
            font-weight: 500;
            font-size: 0.875rem;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-primary {
            background: var(--accent);
            color: white;
        }

        .btn-primary:hover {
            background: var(--accent-hover);
        }

        .btn-secondary {
            background: var(--bg-tertiary);
            color: var(--text-primary);
        }

        .btn-secondary:hover {
            background: var(--bg-hover);
        }

        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            max-width: 900px;
            width: 100%;
            margin: 0 auto;
            padding: 2rem;
        }

        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .welcome-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 2rem;
            text-align: center;
        }

        .welcome-icon {
            width: 64px;
            height: 64px;
            margin: 0 auto 1.5rem;
            background: linear-gradient(135deg, var(--accent) 0%, var(--accent-muted) 100%);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
        }

        .welcome-title {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .welcome-subtitle {
            color: var(--text-secondary);
            margin-bottom: 1.5rem;
        }

        .quick-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 0.75rem;
            justify-content: center;
        }

        .quick-action {
            padding: 0.75rem 1.25rem;
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-primary);
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.875rem;
        }

        .quick-action:hover {
            background: var(--bg-hover);
            border-color: var(--accent);
        }

        .messages {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .message {
            display: flex;
            gap: 1rem;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message-avatar {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 0.875rem;
            flex-shrink: 0;
        }

        .message-user .message-avatar {
            background: var(--accent);
        }

        .message-assistant .message-avatar {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
        }

        .message-content {
            flex: 1;
            min-width: 0;
        }

        .message-header {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 0.5rem;
        }

        .message-name {
            font-weight: 600;
        }

        .message-time {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .message-text {
            color: var(--text-secondary);
            line-height: 1.6;
        }

        .message-text p {
            margin-bottom: 0.75rem;
        }

        .message-text p:last-child {
            margin-bottom: 0;
        }

        .message-text code {
            background: var(--code-bg);
            padding: 0.125rem 0.375rem;
            border-radius: 4px;
            font-family: 'JetBrains Mono', 'Fira Code', monospace;
            font-size: 0.875em;
        }

        .message-text pre {
            background: var(--code-bg);
            padding: 1rem;
            border-radius: 8px;
            overflow-x: auto;
            margin: 1rem 0;
        }

        .message-text pre code {
            background: none;
            padding: 0;
        }

        .message-sources {
            margin-top: 1rem;
            padding-top: 1rem;
            border-top: 1px solid var(--border);
        }

        .sources-title {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.75rem;
        }

        .source-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem;
            background: var(--bg-tertiary);
            border-radius: 6px;
            font-size: 0.875rem;
            color: var(--text-secondary);
            text-decoration: none;
            margin-bottom: 0.5rem;
        }

        .source-item:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
        }

        .source-badge {
            padding: 0.125rem 0.375rem;
            background: var(--accent-muted);
            color: white;
            border-radius: 4px;
            font-size: 0.625rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .web-badge {
            background: var(--success);
        }

        .typing-indicator {
            display: flex;
            gap: 0.5rem;
            padding: 1rem;
        }

        .typing-dot {
            width: 8px;
            height: 8px;
            background: var(--text-muted);
            border-radius: 50%;
            animation: bounce 1.4s infinite;
        }

        .typing-dot:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-dot:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes bounce {
            0%, 60%, 100% {
                transform: translateY(0);
            }
            30% {
                transform: translateY(-6px);
            }
        }

        .input-container {
            position: sticky;
            bottom: 0;
            background: linear-gradient(to top, var(--bg-primary) 80%, transparent);
            padding: 1.5rem 0;
        }

        .input-wrapper {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 0.75rem;
            display: flex;
            align-items: flex-end;
            gap: 0.75rem;
            transition: border-color 0.2s;
        }

        .input-wrapper:focus-within {
            border-color: var(--accent);
        }

        .input-field {
            flex: 1;
            background: none;
            border: none;
            color: var(--text-primary);
            font-size: 1rem;
            font-family: inherit;
            resize: none;
            outline: none;
            padding: 0.5rem;
            max-height: 200px;
            line-height: 1.5;
        }

        .input-field::placeholder {
            color: var(--text-muted);
        }

        .send-btn {
            width: 40px;
            height: 40px;
            background: var(--accent);
            border: none;
            border-radius: 10px;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .send-btn:hover:not(:disabled) {
            background: var(--accent-hover);
        }

        .send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 2rem;
            max-width: 500px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.5rem;
        }

        .modal-title {
            font-size: 1.25rem;
            font-weight: 600;
        }

        .modal-close {
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            padding: 0.5rem;
            border-radius: 6px;
        }

        .modal-close:hover {
            background: var(--bg-tertiary);
            color: var(--text-primary);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .stat-card {
            background: var(--bg-tertiary);
            border-radius: 12px;
            padding: 1rem;
            text-align: center;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 700;
            color: var(--accent);
        }

        .stat-label {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .progress-bar {
            height: 8px;
            background: var(--bg-tertiary);
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 1rem;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent) 0%, var(--accent-hover) 100%);
            border-radius: 4px;
            transition: width 0.3s;
        }

        .progress-text {
            text-align: center;
            font-size: 0.875rem;
            color: var(--text-secondary);
        }

        @media (max-width: 640px) {
            .header {
                padding: 1rem;
            }

            .header-subtitle {
                display: none;
            }

            .main {
                padding: 1rem;
            }

            .welcome-card {
                padding: 1.5rem;
            }

            .quick-actions {
                flex-direction: column;
            }

            .quick-action {
                width: 100%;
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-left">
            <div class="logo">A</div>
            <div>
                <div class="header-title">AIDEN</div>
                <div class="header-subtitle">AcreetionOS AI Documentation Assistant</div>
            </div>
        </div>
        <div class="header-right">
            <div class="status-indicator" id="status">
                <div class="status-dot" id="statusDot"></div>
                <span id="statusText">Checking...</span>
            </div>
            <button class="btn btn-secondary" onclick="openIndexModal()">Index Docs</button>
        </div>
    </header>

    <main class="main">
        <div class="chat-container">
            <div class="welcome-card" id="welcomeCard">
                <div class="welcome-icon">AI</div>
                <h1 class="welcome-title">Hello, I'm AIDEN</h1>
                <p class="welcome-subtitle">Your AI assistant for AcreetionOS documentation</p>
                <div class="quick-actions">
                    <button class="quick-action" onclick="askQuestion('What is AcreetionOS?')">What is AcreetionOS?</button>
                    <button class="quick-action" onclick="askQuestion('How do I install AcreetionOS?')">How do I install?</button>
                    <button class="quick-action" onclick="askQuestion('What desktop environments are available?')">Desktop environments</button>
                    <button class="quick-action" onclick="askQuestion('How do I update the system?')">Update system</button>
                </div>
            </div>

            <div class="messages" id="messages"></div>

            <div class="input-container">
                <div class="input-wrapper">
                    <textarea 
                        class="input-field" 
                        id="inputField" 
                        placeholder="Ask about AcreetionOS..."
                        rows="1"
                        onkeydown="handleKeyDown(event)"
                        oninput="autoResize(this)"
                    ></textarea>
                    <button class="send-btn" id="sendBtn" onclick="sendMessage()">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/>
                        </svg>
                    </button>
                </div>
            </div>
        </div>
    </main>

    <div class="modal-overlay" id="indexModal">
        <div class="modal">
            <div class="modal-header">
                <h2 class="modal-title">Indexing Status</h2>
                <button class="modal-close" onclick="closeIndexModal()">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M18 6L6 18M6 6l12 12"/>
                    </svg>
                </button>
            </div>
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-value" id="filesProcessed">0</div>
                    <div class="stat-label">Files Processed</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="chunksCreated">0</div>
                    <div class="stat-label">Chunks Created</div>
                </div>
            </div>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill" style="width: 0%"></div>
            </div>
            <div class="progress-text" id="progressText">Ready to index</div>
            <div id="indexErrors" style="margin-top: 1rem; font-size: 0.875rem; color: var(--error);"></div>
            <div style="margin-top: 1.5rem; display: flex; gap: 0.75rem;">
                <button class="btn btn-primary" onclick="startIndexing()" style="flex: 1;">Start Indexing</button>
                <button class="btn btn-secondary" onclick="checkIndexStatus()" style="flex: 1;">Check Status</button>
            </div>
        </div>
    </div>

    <script>
        let isTyping = false;
        let conversationHistory = [];

        async function checkHealth() {
            try {
                const response = await fetch('/api/health');
                const data = await response.json();
                
                const statusDot = document.getElementById('statusDot');
                const statusText = document.getElementById('statusText');
                
                if (data.status === 'healthy') {
                    statusDot.className = 'status-dot';
                    statusText.textContent = 'Connected';
                } else if (data.ollama) {
                    statusDot.className = 'status-dot warning';
                    statusText.textContent = 'Qdrant offline';
                } else if (data.qdrant) {
                    statusDot.className = 'status-dot warning';
                    statusText.textContent = 'Ollama offline';
                } else {
                    statusDot.className = 'status-dot error';
                    statusText.textContent = 'Degraded';
                }
            } catch (error) {
                document.getElementById('statusDot').className = 'status-dot error';
                document.getElementById('statusText').textContent = 'Offline';
            }
        }

        function askQuestion(question) {
            document.getElementById('inputField').value = question;
            sendMessage();
        }

        async function sendMessage() {
            const input = document.getElementById('inputField');
            const message = input.value.trim();
            
            if (!message || isTyping) return;
            
            input.value = '';
            input.style.height = 'auto';
            
            document.getElementById('welcomeCard').style.display = 'none';
            
            addMessage('user', message);
            conversationHistory.push({ role: 'user', content: message });
            
            showTyping();
            
            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message })
                });
                
                const data = await response.json();
                hideTyping();
                addMessage('assistant', data.response.content, data.response.sources, data.response.used_web_fallback);
            } catch (error) {
                hideTyping();
                addMessage('assistant', 'Sorry, I encountered an error. Please make sure Ollama and Qdrant are running.');
            }
        }

        function addMessage(role, content, sources = [], usedWebFallback = false) {
            const messages = document.getElementById('messages');
            const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            
            let sourcesHtml = '';
            if (sources && sources.length > 0) {
                sourcesHtml = `
                    <div class="message-sources">
                        <div class="sources-title">Sources</div>
                        ${sources.map(s => `
                            <a href="${s.url}" class="source-item" target="_blank">
                                <span class="source-badge">${s.source_type === 'local' ? 'Local' : 'Web'}</span>
                                <span>${s.title}</span>
                            </a>
                        `).join('')}
                    </div>
                `;
            }
            
            const html = `
                <div class="message message-${role}">
                    <div class="message-avatar">${role === 'user' ? 'U' : 'AI'}</div>
                    <div class="message-content">
                        <div class="message-header">
                            <span class="message-name">${role === 'user' ? 'You' : 'AIDEN'}</span>
                            <span class="message-time">${time}</span>
                        </div>
                        <div class="message-text">${formatContent(content)}</div>
                        ${sourcesHtml}
                    </div>
                </div>
            `;
            
            messages.insertAdjacentHTML('beforeend', html);
            messages.scrollTop = messages.scrollHeight;
        }

        function formatContent(content) {
            return content
                .replace(/```(\w+)?\n([\s\S]*?)```/g, '<pre><code>$2</code></pre>')
                .replace(/`([^`]+)`/g, '<code>$1</code>')
                .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
                .replace(/\n\n/g, '</p><p>')
                .replace(/\n/g, '<br>');
        }

        function showTyping() {
            isTyping = true;
            document.getElementById('sendBtn').disabled = true;
            
            const messages = document.getElementById('messages');
            const html = `
                <div class="message message-assistant" id="typingMessage">
                    <div class="message-avatar">AI</div>
                    <div class="message-content">
                        <div class="message-header">
                            <span class="message-name">AIDEN</span>
                        </div>
                        <div class="typing-indicator">
                            <div class="typing-dot"></div>
                            <div class="typing-dot"></div>
                            <div class="typing-dot"></div>
                        </div>
                    </div>
                </div>
            `;
            messages.insertAdjacentHTML('beforeend', html);
            messages.scrollTop = messages.scrollHeight;
        }

        function hideTyping() {
            isTyping = false;
            document.getElementById('sendBtn').disabled = false;
            
            const typingMessage = document.getElementById('typingMessage');
            if (typingMessage) {
                typingMessage.remove();
            }
        }

        function handleKeyDown(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        }

        function autoResize(textarea) {
            textarea.style.height = 'auto';
            textarea.style.height = Math.min(textarea.scrollHeight, 200) + 'px';
        }

        function openIndexModal() {
            document.getElementById('indexModal').classList.add('active');
            checkIndexStatus();
        }

        function closeIndexModal() {
            document.getElementById('indexModal').classList.remove('active');
        }

        async function startIndexing() {
            try {
                const response = await fetch('/api/index', { method: 'POST' });
                const data = await response.json();
                
                document.getElementById('progressText').textContent = 'Indexing in progress...';
                pollIndexStatus();
            } catch (error) {
                document.getElementById('indexErrors').textContent = 'Failed to start indexing';
            }
        }

        async function checkIndexStatus() {
            try {
                const response = await fetch('/api/index/status');
                const data = await response.json();
                updateIndexUI(data);
            } catch (error) {
                document.getElementById('indexErrors').textContent = 'Failed to check status';
            }
        }

        function pollIndexStatus() {
            checkIndexStatus();
            if (document.getElementById('progressFill').style.width !== '100%') {
                setTimeout(pollIndexStatus, 2000);
            }
        }

        function updateIndexUI(data) {
            document.getElementById('filesProcessed').textContent = data.files_processed;
            document.getElementById('chunksCreated').textContent = data.chunks_created;
            
            if (data.is_indexing) {
                document.getElementById('progressFill').style.width = '50%';
                document.getElementById('progressText').textContent = 'Indexing in progress...';
            } else if (data.files_processed > 0) {
                document.getElementById('progressFill').style.width = '100%';
                document.getElementById('progressText').textContent = 'Indexing complete';
            }
            
            if (data.errors && data.errors.length > 0) {
                document.getElementById('indexErrors').textContent = data.errors.join(', ');
            }
        }

        checkHealth();
        setInterval(checkHealth, 30000);
    </script>
</body>
</html>
